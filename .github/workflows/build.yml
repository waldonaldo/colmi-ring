# Builds an unsigned .ipa on GitHub's Mac runners, so no Mac is needed.
# Install it with Sideloadly or AltStore, which sign it with your own Apple ID.
name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Pick the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project RingApp.xcodeproj -target RingApp \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:" -A4 build.log | head -80; tail -20 build.log; exit 1; }
          tail -5 build.log
          # The .app folder can exist even when compiling failed - check the program itself.
          test -x build/Release-iphoneos/RingApp.app/RingApp

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/RingApp.app Payload/
          # Ad-hoc sign with the entitlements so the sideloading tool keeps
          # HealthKit when it re-signs with your Apple ID.
          codesign -f -s - --entitlements RingApp/RingApp.entitlements Payload/RingApp.app
          zip -qry ColmiRing.ipa Payload
          ls -lh ColmiRing.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ColmiRing-ipa
          path: ColmiRing.ipa

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ColmiRing.ipa --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}. Install with Sideloadly or AltStore." --latest
